
name: DolphinGC PS3 Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y curl tar

      - name: Baixar toolchain PS3
        run: |
          set -e
          export PS3DEV="$HOME/ps3dev"
          mkdir -p "$PS3DEV"

          curl -fL \
            "https://github.com/ps3dev/ps3dev/releases/download/nightly-2026-10-12/ps3dev-linux-X64.tar.gz" \
            -o ps3dev.tar.gz

          tar -xzf ps3dev.tar.gz -C "$PS3DEV"

          echo "PS3DEV=$PS3DEV" >> "$GITHUB_ENV"
          echo "PSL1GHT=$PS3DEV" >> "$GITHUB_ENV"
          echo "$PS3DEV/bin" >> "$GITHUB_PATH"
          echo "$PS3DEV/ppu/bin" >> "$GITHUB_PATH"
          echo "$PS3DEV/spu/bin" >> "$GITHUB_PATH"

      - name: Verificar toolchain
        run: |
          ppu-gcc --version
          
