name: Build PS3

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Descompactar
        run: |
          mkdir -p emu
          unzip -o ./*.zip -d emu
          ls emu

      - name: Compilar
        run: |
          MK=$(find emu -iname Makefile | head -n1)
          DIR=$(dirname "$MK")
          echo "Projeto em: $DIR"
          cat > ps3build.sh <<'EOF'
          cd "$1"
          export PS3DEV=${PS3DEV:-/usr/local/ps3dev}
          export PSL1GHT=${PSL1GHT:-$PS3DE
