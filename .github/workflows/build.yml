name: Build PS3

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Descompactar
        run: |
          mkdir -p emu
          unzip -o ./*.zip -d emu
          echo "=== Arquivos extraídos ==="
          ls -R emu | head -n 60

      - name: Compilar
        run: |
          MK=$(find emu -iname Makefile | head -n1)
          if [ -z "$MK" ]; then
            echo "ERRO: nenhum Makefile dentro do zip"
            exit 1
          fi
          DIR=$(dirname "$MK")
          echo "Compilando em: $DIR"
          docker run --rm -v "$PWD:/src" -w "/src/$DIR" flipacholas/ps3devextra:ubuntu-latest make -j4

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gc-emu-ps3
          path: |
            emu/**/*.self
            emu/**/*.pkg
            emu/**/*.elf
