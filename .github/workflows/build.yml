name: Build PKG
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Achar o projeto
        run: |
          if [ -f ps3build.sh ]; then
            D=.
          else
            for z in *.zip; do
              n=$(unzip -Z1 "$z" || true)
              if grep -q ps3build.sh <<<"$n"; then
                mkdir -p _p && unzip -q "$z" -d _p
                break
              fi
            done
            D=$(dirname "$(find . -name ps3build.sh | head -n1)")
          fi
          echo "D=$D" >> "$GITHUB_ENV"

      - name: Compilar e gerar o PKG
        run: |
          docker run --rm -v "$PWD/$D:/build" -w /build \
            ghcr.io/altps3/ps3dev:latest bash ps3build.sh

      - name: Artefato (zip com o PKG)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DolphinGC-PKG
          path: |
            ${{ env.D }}/*.pkg
            ${{ env.D }}/*.self
            ${{ env.D }}/build.log
            ${{ env.D }}/pkg.log
