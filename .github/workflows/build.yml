name: Build DolphinGC PS3 PKG

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pkg:
    name: Build and package for PS3
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download latest official PS3DEV SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          asset_url="$(gh api repos/ps3dev/ps3dev/releases \
            --jq 'map(select(.prerelease and (.draft | not)))
              | sort_by(.published_at)
              | reverse
              | .[0].assets[]
              | select(.name == "ps3dev-linux-X64.tar.gz")
              | .browser_download_url')"

          if [[ -z "$asset_url" ]]; then
            echo "Nao encontrei o asset Linux x64 do release PS3DEV." >&2
            exit 1
          fi

          echo "Baixando SDK oficial: $asset_url"
          curl --fail --location --retry 3 "$asset_url" \
            --output "$RUNNER_TEMP/ps3dev-sdk.tar.gz"
          tar -xzf "$RUNNER_TEMP/ps3dev-sdk.tar.gz" \
            -C "$GITHUB_WORKSPACE"

          test -f "$GITHUB_WORKSPACE/ps3dev/ppu_rules"

      - name: Configure PS3DEV environment
        run: |
          echo "PS3DEV=$GITHUB_WORKSPACE/ps3dev" >> "$GITHUB_ENV"
          echo "PSL1GHT=$GITHUB_WORKSPACE/ps3dev" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/ps3dev/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ps3dev/ppu/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ps3dev/spu/bin" >> "$GITHUB_PATH"

      - name: Verify SDK tools
        run: |
          set -euo pipefail
          for tool in ppu-g++ sprxlinker make_self make_self_npdrm sfo pkg package_finalize; do
            command -v "$tool"
          done

      - name: Build ELF, SELF and PKG
        run: |
          set -euo pipefail

          sfo_file="$(find . -path './ps3dev' -prune -o -type f -name sfo.xml -print -quit)"
          if [[ -z "$sfo_file" ]]; then
            echo "Nao encontrei sfo.xml do projeto; confira se o repositorio contem os fontes do emulador." >&2
            exit 1
          fi

          project_dir="$(dirname "$sfo_file")"
          if [[ ! -f "$project_dir/Makefile" || ! -d "$project_dir/src" ]]; then
            echo "A pasta que contem sfo.xml nao contem Makefile e src/: $project_dir" >&2
            exit 1
          fi

          echo "Pasta do projeto: $project_dir"
          mkdir -p "$GITHUB_WORKSPACE/pkg-output"
          cd "$project_dir"
          make clean
          make pkg 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          for file in dolphinGCV0.2.pkg dolphinGCV0.2.gnpdrm.pkg dolphinGCV0.2.elf dolphinGCV0.2.self; do
            if [[ -f "$file" ]]; then
              cp -f "$file" "$GITHUB_WORKSPACE/pkg-output/"
            fi
          done

      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DolphinGC-PS3-${{ github.sha }}
          path: |
            pkg-output/*
            build.log
          if-no-files-found: warn
          retention-days: 14
          
