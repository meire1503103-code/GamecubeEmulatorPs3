name: Build PKG
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Achar o projeto
        run: |
          if [ -f ps3build.sh ]; then
            D=.
          else
            for z in *.zip; do
              n=$(unzip -Z1 "$z" || true)
              if grep -q ps3build.sh <<<"$n"; then
                mkdir -p _p && unzip -q "$z" -d _p
                break
              fi
            done
            D=$(dirname "$(find . -name ps3build.sh | head -n1)")
          fi
          echo "D=$D" >> "$GITHUB_ENV"

      - name: Preservar a pasta pkg/ do projeto
        run: |
          # O ps3build.sh apaga pkg/ e sobrescreve o ICON0/PIC1; isso evita
          # perder seus config/saves/DolphinGC e os icones atualizados.
          cd "$D"
          sed -i 's#^rm -rf pkg && mkdir -p pkg/USRDIR#mkdir -p pkg/USRDIR#; s#^  cp ICON0.PNG PIC1.PNG pkg/#  [ -f pkg/ICON0.PNG ] || cp ICON0.PNG pkg/; [ -f pkg/PIC1.PNG ] || cp PIC1.PNG pkg/#' ps3build.sh

      - name: Compilar e gerar o PKG
        run: |
          docker run --rm -v "$PWD/$D:/build" -w /build \
            ghcr.io/altps3/ps3dev:latest bash ps3build.sh

      - name: Artefato (zip com o PKG)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DolphinGC-PKG
          path: |
            ${{ env.D }}/*.pkg
            ${{ env.D }}/*.self
            ${{ env.D }}/build.log
            ${{ env.D }}/pkg.log
