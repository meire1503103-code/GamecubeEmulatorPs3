name: Build PS3

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Descompactar
        run: |
          mkdir -p emu
          unzip -o ./*.zip -d emu

      - name: Compilar
        run: |
          MK=$(find emu -iname Makefile | head -n1)
          DIR=$(dirname "$MK")
          cat > ps3build.sh <<'EOF'
          cd "$1"
          export PS3DEV=${PS3DEV:-/usr/local/ps3dev}
          export PSL1GHT=${PSL1GHT:-$PS3DEV}
          export PATH=$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin

          # Ajustes de compatibilidade com o newlib do PS3
          sed -i 's/std::snprintf/snprintf/g; s/std::vsnprintf/vsnprintf/g; s/std::isnan(/__builtin_isnan(/g; s/std::isinf(/__builtin_isinf(/g' src/*.cpp src/*.h
          cat > ps3shim.h <<'SHIM'
          #include <cstdio>
          #include <cmath>
          namespace std {
            using ::snprintf;
            using ::fma;
            using ::trunc;
            using ::nearbyint;
          }
          SHIM

          ppu-g++ -O2 -std=gnu++11 -Wall -DDOLPHINPS3_PLATFORM_PS3 \
            -include ./ps3shim.h \
            -I$PSL1GHT/ppu/include -I$PS3DEV/ppu/include \
            src/*.cpp \
            -L$PSL1GHT/ppu/lib -L$PS3DEV/ppu/lib \
            -lrsx -lgcm_sys -lio -lsysutil -lrt -llv2 -lm \
            -o dolphinGCV.01.elf > build.log 2>&1
          RC=$?
          echo "=== RESUMO DOS ERROS ==="
          grep -E "error|undefined reference|cannot find" build.log | head -n 30
          echo "=== FIM (codigo $RC) ==="
          exit $RC
          EOF
          docker run --rm -v "$PWD:/build" -w /build \
            ghcr.io/altps3/ps3dev:latest sh ps3build.sh "/build/$DIR"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gc-emu-ps3
          path: |
            emu/**/*.elf
            emu/**/build.log
