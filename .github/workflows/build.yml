name: Build PS3

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descompactar
        run: |
          mkdir -p emu
          unzip -o ./*.zip -d emu

      - name: Compilar
        run: |
          DIR=$(dirname "$(find emu -iname Makefile | head -n1)")
          echo "Projeto em: $DIR"
          docker run --rm -v "$PWD:/build" -w "/build/$DIR" ghcr.io/altps3/ps3dev:latest sh -c '
          export PS3DEV=${PS3DEV:-/usr/local/ps3dev}
          export PSL1GHT=${PSL1GHT:-$PS3DEV}
          export PATH=$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin
          sed -i "s/std::snprintf/snprintf/g; s/std::vsnprintf/vsnprintf/g; s/std::isnan(/__builtin_
