name: Build PS3

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Compilar
        run: |
          docker run --rm -v "$PWD:/src" flipacholas/ps3devextra:ubuntu-latest make -j4

      - name: Gerar PKG
        run: |
          docker run --rm -v "$PWD:/src" flipacholas/ps3devextra:ubuntu-latest make pkg

      - uses: actions/upload-artifact@v4
        with:
          name: gc-emu-ps3
          path: |
            **/*.self
            **/*.pkg
