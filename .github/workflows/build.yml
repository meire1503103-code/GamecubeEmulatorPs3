name: Build PS3

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descompactar
        run: |
          mkdir -p emu
          unzip -o ./*.zip -d emu

      - name: Compilar
        run: |
          DIR=$(dirname "$(find emu -iname Makefile | head -n1)")
          docker run --rm -v "$PWD:/build" -w "/build/$DIR" ghcr.io/altps3/ps3dev:latest sh ps3build.sh

      - name: Conferir arquivos
        if: always()
        run: find emu -name '*.elf' -o -name '*.self' -o -name '*.pkg' -o -name '*.log'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gc-emu-ps3
          if-no-files-found: error
          path: |
            emu/**/*.pkg
            emu/**/*.self
            emu/**/*.elf
            emu/**/*.log
