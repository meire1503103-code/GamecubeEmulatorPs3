name: Build PS3

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Descompactar
        run: |
          mkdir -p emu
          unzip -o ./*.zip -d emu
          ls -R emu | head -n 60

      - name: Compilar
        run: |
          MK=$(find emu -iname Makefile | head -n1)
          DIR=$(dirname "$MK")
          echo "Compilando em: $DIR"
          docker run --rm -v "$PWD:/src" -w "/src/$DIR" \
            -e PS3DEV=/usr/local/ps3dev \
            -e PSL1GHT=/usr/local/ps3dev \
            -e CPATH=/usr/local/ps3dev/ppu/include:/usr/local/ps3dev/portlibs/ppu/include \
            flipacholas/ps3devextra:ubuntu-latest \
            sh -c 'find / -name pad.h -path "*io/*" 2>/dev/null; make -j4'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gc-emu-ps3
          path: |
            emu/**/*.self
            emu/**/*.pkg
            emu/**/*.elf
