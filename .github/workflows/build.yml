name: Build PS3

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Descompactar
        run: |
          mkdir -p emu
          unzip -o ./*.zip -d emu

      - name: Diagnostico
        run: |
          MK=$(find emu -iname Makefile | head -n1)
          echo "=== MAKEFILE ($MK) ==="
          cat "$MK"

      - name: Compilar
        run: |
          MK=$(find emu -iname Makefile | head -n1)
          DIR=$(dirname "$MK")
          docker run --rm -v "$PWD:/build" -w "/build/$DIR" \
            ghcr.io/altps3/ps3dev:latest \
            sh -c 'find $PS3DEV -name pad.h | head -n3; make -j4'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gc-emu-ps3
          path: |
            emu/**/*.self
            emu/**/*.pkg
            emu/**/*.elf
