name: Build DolphinGC PS3 PKG

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pkg:
    name: Test and package for PS3
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Run host tests
        run: make -f Makefile.host test

      - name: Download latest official PS3DEV SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          asset_url="$(gh api repos/ps3dev/ps3dev/releases \
            --jq 'map(select(.prerelease and (.draft | not)))
              | sort_by(.published_at)
              | reverse
              | .[0].assets[]
              | select(.name == "ps3dev-linux-X64.tar.gz")
              | .browser_download_url')"

          if [[ -z "$asset_url" ]]; then
            echo "Não encontrei o asset Linux x64 do release PS3DEV." >&2
            exit 1
          fi

          echo "Baixando SDK oficial: $asset_url"
          curl --fail --location --retry 3 "$asset_url" \
            --output "$RUNNER_TEMP/ps3dev-sdk.tar.gz"
          tar -xzf "$RUNNER_TEMP/ps3dev-sdk.tar.gz" \
            -C "$GITHUB_WORKSPACE"

          test -f "$GITHUB_WORKSPACE/ps3dev/ppu_rules"

      - name: Configure PS3DEV environment
        run: |
          echo "PS3DEV=$GITHUB_WORKSPACE/ps3dev" >> "$GITHUB_ENV"
          echo "PSL1GHT=$GITHUB_WORKSPACE/ps3dev" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/ps3dev/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ps3dev/ppu/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ps3dev/spu/bin" >> "$GITHUB_PATH"

      - name: Verify SDK tools
        run: |
          set -euo pipefail
          for tool in ppu-g++ sprxlinker make_self make_self_npdrm sfo pkg package_finalize; do
            command -v "$tool"
          done

      - name: Build ELF, SELF and PKG
        run: |
          set -euo pipefail
          make clean
          make pkg 2>&1 | tee build.log

      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DolphinGC-PS3-${{ github.sha }}
          path: |
            dolphinGCV0.2.pkg
            dolphinGCV0.2.gnpdrm.pkg
            dolphinGCV0.2.elf
            dolphinGCV0.2.self
            build.log
          if-no-files-found: warn
          retention-days: 14
          
