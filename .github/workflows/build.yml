name: Build PS3

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Descompactar
        run: |
          mkdir -p emu
          unzip -o ./*.zip -d emu
          ls -R emu | head -n 60

      - name: Diagnostico
        run: |
          MK=$(find emu -iname Makefile | head -n1)
          echo "=== MAKEFILE ($MK) ==="
          cat "$MK"
          echo "=== TOOLCHAIN NA IMAGEM ==="
          docker run --rm flipacholas/ps3devextra:ubuntu-latest sh -c 'echo PS3DEV=$PS3DEV; echo PSL1GHT=$PSL1GHT; which ppu-g++; find / -name pad.h 2>/dev/null | head'

      - name: Compilar
        run: |
          MK=$(find emu -iname Makefile | head -n1)
          DIR=$(dirname "$MK")
          docker run --rm -v "$PWD:/src" -w "/src/$DIR" \
            flipacholas/ps3devextra:ubuntu-latest \
            sh -c 'export PS3DEV=${PS3DEV:-/usr/local/ps3dev}; export PSL1GHT=${PSL1GHT:-$PS3DEV}; export PATH=$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin; make -j4 CC=ppu-gcc CXX=ppu-g++'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gc-emu-ps3
          path: |
            emu/**/*.self
            emu/**/*.pkg
            emu/**/*.elf
